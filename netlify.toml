# Astro static build (AEO rebuild, 2026-10-05). This file overrides the
# Netlify UI build settings for this repo.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets are immutable (AEO S2 §I); HTML revalidates every time.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# IndexNow: after each production deploy, tell Bing & co. which pages changed
# (scripts/indexnow.mjs). Previews never submit. Kill switch: INDEXNOW_DISABLED=1.
[[plugins]]
  package = "/netlify/plugins/indexnow"
