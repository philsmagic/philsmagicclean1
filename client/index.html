    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V3TMEPTD2V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V3TMEPTD2V');
    </script>
    <!-- Meta Pixel -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1076653965253682');
      fbq('track', 'PageView');

      // This is a single-page app: wouter changes the URL without a reload,
      // so the pixel would only ever see the first page. Re-fire PageView
      // whenever the route actually changes.
      (function () {
        var last = location.pathname;
        function onRouteChange() {
          if (location.pathname === last) return;
          last = location.pathname;
          fbq('track', 'PageView');
        }
        ['pushState', 'replaceState'].forEach(function (m) {
          var orig = history[m];
          history[m] = function () {
            var r = orig.apply(this, arguments);
            onRouteChange();
            return r;
          };
        });
        window.addEventListener('popstate', onRouteChange);

        // A click through to a Jobber request form is the conversion that
        // matters — it is the only way a quote request reaches Phil from here.
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest && e.target.closest('a[href]');
          if (!a) return;
          if (a.href.indexOf('clienthub.getjobber.com') === -1) return;
          var janitorial = a.href.indexOf('5126135') !== -1;
          fbq('track', 'Lead', {
            content_name: janitorial ? 'Janitorial request form' : 'General request form'
          });
          // GA4 key event `quote_click` — site-fired so GA4's outbound-click
          // domain settings can never silently disable it. Same tagging as
          // Lead so Meta and GA4 reconcile. Exact name; E.L. registers it in
          // GA4 Admin by name. (Retrofit for the before/after baseline, 2026-10-05.)
          if (window.gtag) gtag('event', 'quote_click', {
            request_type: janitorial ? 'janitorial' : 'general',
            link_url: a.href,
            page_path: location.pathname
          });
        }, true);
      })();
    </script>
